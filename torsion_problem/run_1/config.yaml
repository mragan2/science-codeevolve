CODEBASE_PATH: src/
EMBEDDING:
  model_name: qwen3-embedding:4b
  retries: 3
  verify_ssl: false
EVAL_FILE_NAME: evaluate.py
EVAL_TIMEOUT: 30
EVOLVE_CONFIG:
  ckpt: 10
  early_stopping_rounds: 80
  evolve_end_marker: '# EVOLVE-BLOCK-END'
  evolve_start_marker: '# EVOLVE-BLOCK-START'
  exploration_rate: 0.35
  fitness_key: combined_score
  init_pop: 10
  max_chat_depth: 4
  max_size: null
  meta_prompting: true
  migration_interval: 15
  migration_rate: 0.15
  migration_topology: ring
  mp_end_marker: '# PROMPT-BLOCK-END'
  mp_start_marker: '# PROMPT-BLOCK-START'
  num_epochs: 100
  num_inspirations: 4
  num_islands: 7
  scheduler_kwargs:
    decrease_factor: 0.95
    increase_factor: 1.05
    max_rate: 0.4
    min_rate: 0.15
    plateau_threshold: 5
  selection_kwargs:
    roulette_by_rank: true
  selection_policy: roulette
  type: PlateauScheduler
  use_embedding: true
  use_map_elites: true
  use_scheduler: true
EXPLOITATION_ENSEMBLE:
- model_name: qwen3-coder:480b-cloud
  retries: 2
  temp: 0.55
  top_p: 0.9
  verify_ssl: false
  weight: 0.7
- model_name: devstral-2:123b-cloud
  retries: 2
  temp: 0.55
  top_p: 0.9
  verify_ssl: false
  weight: 0.3
EXPLORATION_ENSEMBLE:
- model_name: qwen3-coder:480b-cloud
  retries: 2
  temp: 0.75
  top_p: 0.92
  verify_ssl: false
  weight: 0.6
- model_name: kimi-k2:1t-cloud
  retries: 2
  temp: 0.75
  top_p: 0.92
  verify_ssl: false
  weight: 0.4
INIT_FILE_DATA:
  filename: init_program.py
  language: python
MAP_ELITES:
  elite_map_type: grid
  features:
  - max_val: 10.0
    min_val: -10.0
    name: delta_bic
    num_bins: 10
  - max_val: 0.06
    min_val: 0.0
    name: r_torsion
    num_bins: 6
MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1
SAMPLER_AUX_LM:
  model_name: qwen3-next:80b-cloud
  retries: 2
  temp: 0.35
  top_p: 0.9
  verify_ssl: false
  weight: 1
SEED: 42
SYS_MSG: "# PROMPT-BLOCK-START\n\nCONTEXT: You are an expert in Einstein-Cartan cosmology\
  \ with torsion. You optimize torsion parameters to fit CMB TT, EE, and TE spectra\
  \ simultaneously.\n\nYOUR MISSION:\n- Evolve torsion parameters (kappa, beta, r,\
  \ n_t) to BEAT LCDM\n- Find optimal spin-torsion coupling for polarization\n- Predict\
  \ B-mode amplitude for CMB-S4\n\nKNOWN FROM PREVIOUS EVOLUTION:\n- alpha = 3/2 is\
  \ FIXED by ECSK theory (do not change!)\n- kappa ~ 0.804 gives S(2) ~ 0.196 for\
  \ TT\n- Delta-BIC = -3.73 for TT alone\n\nPARAMETERS TO EVOLVE:\n- kappa: Torsion\
  \ coupling strength [0.7, 0.9]\n- beta: Spin-polarization coupling [0.5, 0.8]\n\
  - r_torsion: Tensor-to-scalar ratio [0.001, 0.06]\n- n_t: Tensor spectral tilt [-0.1,\
  \ 0.1]\n\nECSK THEORETICAL PREDICTIONS:\n- S_EE ~ S_TT^(2/3) for spin-2 coupling\n\
  - r ~ kappa^2 * (H/M_P)^2 from bounce dynamics\n- n_t ~ -2*epsilon where epsilon\
  \ is slow-roll parameter\n\nHARD CONSTRAINTS:\n1. S_TT(2) ~ 0.196 (Planck observation)\n\
  2. r < 0.06 (BICEP/Keck limit)\n3. S(ell) -> 1 as ell -> infinity\n4. |n_t| < 0.1\
  \ (nearly scale-invariant)\n\nSUCCESS METRICS:\n- combined_score > 0.7 = good model\n\
  - beats_lcdm = true (Delta-BIC < 0)\n- physics_score > 0.8 = physically consistent\n\
  - correlation_score > 0.9 = consistent with S_EE ~ S_TT^(2/3)\n\nFORMULAS TO MODIFY:\n\
  \nS_TT(ell) = 1 - kappa / (1 + (ell-2))^(3/2)   # alpha=3/2 fixed\nS_EE(ell) = S_TT(ell)^beta\
  \                     # evolve beta\nS_TE(ell) = sqrt(S_TT * S_EE)             \
  \     # cross-correlation\n\nPOSSIBLE IMPROVEMENTS:\n- Sign modulation for TE at\
  \ low ell (bounce dynamics)\n- Nonlinear EE-TT coupling\n- ell-dependent beta\n\
  - Quantum corrections to r_torsion\n\nCRITICAL CODE RULES:\n1. Use ONLY ASCII characters\
  \ (a-z, A-Z, 0-9, standard punctuation)\n2. NO Greek letters (alpha, beta, kappa,\
  \ etc.) - use English names instead\n3. NO Unicode math symbols (no \u2248, \u2208\
  , \u2192, \xB2, etc.)\n4. NO special characters that are not on a standard US keyboard\n\
  5. Keep the same function signatures: get_torsion_params(), S_TT(ell, params), S_EE(ell,\
  \ params), S_TE(ell, params)\n6. All functions must return valid floats > 0\n\n\
  torsion / cartan / spin / bounce / tensor / B-mode / polarization\n\n# PROMPT-BLOCK-END\n"
