SYS_MSG: |
  # PROMPT-BLOCK-START
  You are optimizing a connectome-driven C. elegans locomotion simulator.
  Maximize fitness = 1/(1+loss). Current best: ~0.52. Target: >0.60.

  LOSS = 0.5*behavior + 0.5*neural + 0.1*consistency
  Behavior weights: curv_mean 0.35★★★, curv_std 0.25★★, curv_psd 0.20★★, vel_mean 0.10, vel_std 0.05, vel_psd 0.05, traj_speed 0.10
  Neural weights:   neural_mean 0.4, neural_std 0.2, neural_corr 0.4★★★

  TOP 3 PRIORITIES:
  1. curv_mean (0.35w): Head bending too weak. Try steeper gradient:
     segment_gains = np.exp(-np.linspace(0, 5.0, segs))
     Or: segment_gains = np.linspace(1.0, 0.1, segs)**1.5
  2. curv_psd (0.20w): Frequency content wrong. Try non-sinusoidal waveforms:
     curv = np.tanh(3*np.sin(phase))  OR  sin(phase)+0.3*sin(2*phase)
     Or: Kuramoto coupled oscillators (dθ/dt = ω + K*Σsin(θ_j-θ_i))
  3. neural_corr (0.16 effective): Correlation structure off. Try:
     - Stronger reciprocal inhibition (ava_avb_inhibition 0.5→0.8)
     - Class-specific tau_m: command=0.25, sensory=0.08, motor=0.12
     - Increase gamma_gap (0.06→0.10)
     - Ornstein-Uhlenbeck correlated noise instead of white noise

  ARCHITECTURAL ALTERNATIVES (try ONE per mutation):
  A) Kuramoto phase oscillators for body segments
  B) Izhikevich spiking model (dv/dt=0.04v²+5v+140-u+I)
  C) Dorsal/ventral muscle asymmetry
  D) Synaptic delay (chem_current from activity_history[t-2])

  PARAMETER RANGES: tau_m [0.08,0.25], beta_chem [0.6,1.2], gamma_gap [0.04,0.15],
  adapt_strength [0.05,0.25], bias_current [0.5,1.2], noise_std [0.04,0.15],
  curv_amp_base [0.3,1.0], omega_forward [0.3,0.7]*2π

  HARD CONSTRAINTS (violation → -inf fitness):
  - Load REAL connectome from Excel SI5 (no fabricated matrices)
  - Preserve function signature and return dict keys exactly
  - Seed all randomness from CE_SEED env variable
  - Output one JSON line: positions, velocities, curvature, neural, dt, n_neurons, chem_sum, chem_nnz, gap_sum, gap_nnz
  - Keep dt in [0.02, 0.2], steps >= 300
  - Do NOT remove W normalization or break connectome loading
  - Do NOT add external dependencies beyond numpy/pandas/xml

  STRATEGY: ONE structural change OR 2-3 related parameter tweaks per mutation.
  Clip sigmoid/tanh inputs to [-10,10]. np.clip extreme values. Guard divide-by-zero.
  # PROMPT-BLOCK-END

CODEBASE_PATH: "src/"
INIT_FILE_DATA: {filename: "init_program.py", language: "python"}
EVAL_FILE_NAME: "evaluate.py"
EVAL_TIMEOUT: 210
POST_CKPT_CMD:
  - python
  - problems/elegans/find_winner.py
POST_CKPT_CWD: .
POST_CKPT_ISLAND: 0

SEED: 42

MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG:
  fitness_key: "fitness"
  num_epochs: 200
  ckpt: 10
  max_size: 60
  init_pop: 8              # Faster startup, still enough diversity

  exploration_rate: 0.45   # High exploration to escape local optimum
  selection_policy: roulette
  selection_kwargs: {roulette_by_rank: True}
  early_stopping_rounds: 60

  num_islands: 4
  migration_topology: ring
  migration_interval: 20   # Let islands diverge before sharing
  migration_rate: 0.10

  meta_prompting: False    # Disabled: adds ~60s/epoch latency, not improving results
  use_embedding: False     # Disabled: overhead without MAP-Elites
  use_map_elites: False

  num_inspirations: 2      # Less context bloat → fewer SEARCH/REPLACE failures
  max_chat_depth: 3        # Focused history

  mp_start_marker: "# PROMPT-BLOCK-START"
  mp_end_marker: "# PROMPT-BLOCK-END"
  evolve_start_marker: "# EVOLVE-BLOCK-START"
  evolve_end_marker: "# EVOLVE-BLOCK-END"

  use_scheduler: True
  type: PlateauScheduler
  scheduler_kwargs:
    min_rate: 0.20         # Higher floor to maintain exploration
    max_rate: 0.55         # Higher ceiling for bold moves
    plateau_threshold: 10  # Responsive to stalls
    increase_factor: 1.12
    decrease_factor: 0.90

# Removed devstral-small-2:24b (no DIFF blocks) and nemotron-nano (malformed output)

