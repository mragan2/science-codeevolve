SYS_MSG: |
  # PROMPT-BLOCK-START 
  SCENARIO: You are an embedded systems expert.
  OBJECTIVE: Evolve a "Self-Correction Gate" for signal 0b111000111000.
  CONSTRAINTS: Modify EVOLVE-BLOCK only. Use bitwise ops.
  ALGO: Implement Hamming distance check (popcount <= 2).
  # PROMPT-BLOCK-END

CODEBASE_PATH: "input/src/"
INIT_FILE_DATA:
  filename: "initial_program.py"
  language: "python"
EVAL_FILE_NAME: "input/evaluate.py"
EVAL_TIMEOUT: 10

MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG:
  fitness_key: combined_score
  num_epochs: 20
  ckpt: 5
  max_size: null
  init_pop: 10
  exploration_rate: 0.2
  selection_policy: roulette
  selection_kwargs:
    roulette_by_rank: true
  early_stopping_rounds: null
  num_islands: 1
  migration_topology: ring
  migration_interval: 10
  migration_rate: 0.1
  meta_prompting: true
  use_embedding: false
  use_map_elites: false
  num_inspirations: 2
  max_chat_depth: null
  evolve_start_marker: "# EVOLVE-BLOCK-START"
  evolve_end_marker: "# EVOLVE-BLOCK-END"
  use_scheduler: false
  type: PlateauScheduler
  scheduler_kwargs:
    min_rate: 0.2
    max_rate: 0.5
    plateau_threshold: 5
    increase_factor: 1.05
    decrease_factor: 0.95

ENSEMBLE:
  - model_name: "qwen3-coder:480b-cloud"
    temp: 0.6
    top_p: 0.9
    retries: 3
    weight: 1.0
    verify_ssl: false

SAMPLER_AUX_LM:
  model_name: "gpt-oss:20b-cloud"
  temp: 0.45
  top_p: 0.90
  retries: 3
  weight: 1
  verify_ssl: false

EMBEDDING:
  model_name: "qwen3-embedding:4b"
  retries: 3
  verify_ssl: false

MAP_ELITES:
  elite_map_type: "grid"
  features:
    - name: "accuracy"
      min_val: 0
      max_val: 1
      num_bins: 10
