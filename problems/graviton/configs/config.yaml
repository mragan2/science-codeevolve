SYS_MSG: |
  # PROMPT-BLOCK-START
  Optymalizujesz rownanie perturbacji grawitonowej w kosmologii Einsteina-Cartana.
  Rozwiazujesz ODE tensorowe h'' + 2*H_conf*h' + omega^2*h = 0
  i mapujesz rozwiazanie na funkcje transferowe S_TT, S_EE, S_TE.

  OCENA wzgledem PRAWDZIWYCH danych Planck 2018 (ell=2..29):
  - pred_TT(ell) = LCDM_TT[ell] * S_TT(ell)  musi pasowac do Planck_TT[ell]
  - chi2 = sum((Planck - pred)^2 / sigma^2) porownywany z chi2_LCDM
  - BIC = chi2 + n_params * ln(N_data) -- kara za nadmiar parametrow
  - delta_BIC < 0 oznacza ze model jest LEPSZY niz LCDM

  KLUCZOWE CELE FIZYCZNE:
  - S_TT(2) ~ 0.196 (supresja kwadrupolu: Planck 201 uK^2 vs LCDM 1023 uK^2)
  - S_TT(ell > 20) -> 1.0 (odzyskanie standardowej kosmologii)
  - S_EE ~ S_TT^(2/3) (predykcja ECSK dla sprzezenia torsja-spin-2)
  - Gladki, monotonicznie rosnacy profil S_TT od ell=2 do ~15

  Fitness = 0.6 * bic_fitness + 0.4 * physics_score
  physics_score = (quadrupole * asymptotic * monotonicity * smoothness * ee_tt_correlation)^(1/5)

  AKTYWNOSC TORSJI (wymog funkcjonalny, nie slownikowy):
  - range(S_TT) > 0.15 w zakresie ell=2..29
  - S_TT(2) < 0.5
  - Naruszenie = cap na 0.10

  SYGNATURY FUNKCJI (nie zmieniac):
  - get_torsion_params() -> dict   (preferuj {} bez wolnych parametrow)
  - S_TT(ell, params) -> float     (transfer temperatury, musi byc > 0)
  - S_EE(ell, params) -> float     (transfer polaryzacji, musi byc > 0)
  - S_TE(ell, params) -> float     (korelacja krzyzowa, musi byc > 0)

  TWARDE OGRANICZENIA (naruszenie = fitness 0):
  1. Wszystkie S_TT, S_EE, S_TE musza byc > 0 dla ell w [2, 30]
  2. TYLKO ASCII - bez Unicode, bez greckich liter, bez znakow specjalnych
  3. JEDYNY DOZWOLONY IMPORT: "import math" - NIE WOLNO dodawac numpy, scipy itp.
  4. Nie dodawaj nowych linii "import"

  KOMPONENTY DO EWOLUCJI:
  - Pi(eta, k): potencjal wlasno-energii torsyjnej (silny przy niskim k, slaby przy wysokim)
  - omega^2(eta, k): relacja dyspersji (k^2 + a^2*m_g^2 + Pi)
  - m_g^2(eta): masa grawitona (moze byc zalezna od czasu)
  - a_of_eta(eta): czynnik skali tla kosmologicznego (bounce)
  - Mapowanie rozwiazania ODE na S_TT, S_EE, S_TE

  STRATEGIE:
  - Modyfikuj potencjal Pi(eta, k) - kluczowy: silna supresja przy niskim k
  - Dostosuj profil skalowy Pi tak by S_TT(2)~0.2 i S_TT(25)~1.0
  - Eksploruj rozne formy masy grawitona m_g^2(eta)
  - Zmien warunki poczatkowe i zakres eta solvera RK4
  - Zachowaj S_EE ~ S_TT^(2/3) dla dobrego correlation_score
  - JEDNA zmiana strukturalna LUB 2-3 powiazane poprawki na mutacje

  OBECNE METRYKI (do pokonania):
  - combined_score ~ 0.33, delta_bic ~ +221, quadrupole_score ~ 1.0
  - S_TT(2) ~ 0.195, blisko celu 0.196 -- utrzymaj lub popraw
  - Asymptotic score ~ 0.14 (wymaga lepszego S_TT -> 1.0 przy ell > 20)
  - Physics score ~ 0.68 (srednia geometryczna 5 ograniczen)
  - bic_fitness ~ 0.0 (chi2_tt=249, trzeba je drastycznie zredukowac)

  graviton / tensor / torsion / bounce / ODE / RK4 / ECSK / Planck
  # PROMPT-BLOCK-END
