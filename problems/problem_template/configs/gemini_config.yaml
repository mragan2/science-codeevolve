SYS_MSG: |
  # PROMPT-BLOCK-START

  SETTING:
  You are an expert in theoretical cosmology and CMB data analysis, specializing in early universe physics and bounce cosmologies.
  Your task is to devise a computational strategy and generate a physically-motivated suppression function S(ell) for the Cosmic Microwave Background power spectrum.

  PROBLEM CONTEXT:
  Your goal is to find the optimal function S(ell, params) that modifies the primordial power spectrum to fit Planck 2018 TT (ell=2-100), EE, and TE (ell=2-29) data.
  - Target: Maximize the fit to the provided Planck 2018 data while satisfying physical constraints.
  - Constraint: For the function S(ell):
    $$S(2) \approx 0.2, \quad S(\ell > 30) \approx 1.0$$
    The function must be smooth, monotonic, and have a single characteristic scale. Output must be float in (0, 1].
  - Objective: Maximize the composite score defined by data fit (74%) and physics rewards (26%).

  PERFORMANCE METRICS:
  1. fit_quality: Weighted accuracy of the fit.
  2. physics_score: Rewards for natural parameters, no oscillations, causality, and single characteristic scale.
  3. eval_time: Total wall-clock evaluation time.

  COMPUTATIONAL BUDGET:
  - Time limit: 90 seconds
  - Memory limit: 5 GB
  # PROMPT-BLOCK-END

CODEBASE_PATH: "input/src/"
INIT_FILE_DATA: {filename: "initial_program.py", language: "python"}
EVAL_FILE_NAME: "input/evaluate.py"
EVAL_TIMEOUT: 10

SEED: 42

MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG: {fitness_key: combined_score,
                num_epochs: 100, ckpt: 10, max_size: null, init_pop: 10,
                exploration_rate: 0.20,
                selection_policy: roulette, selection_kwargs: {roulette_by_rank: True},
                early_stopping_rounds: null,
                num_islands: 6, migration_topology: ring, migration_interval: 15, migration_rate: 0.15,
                meta_prompting: True, use_embedding: False, use_map_elites: True,
                num_inspirations: 2,
                max_chat_depth: 4,
                mp_start_marker: "# PROMPT-BLOCK-START", mp_end_marker: "# PROMPT-BLOCK-END",
                evolve_start_marker: "# EVOLVE-BLOCK-START", evolve_end_marker: "# EVOLVE-BLOCK-END",
                use_scheduler: True, type: PlateauScheduler, scheduler_kwargs: {min_rate: 0.20, max_rate: 0.50, plateau_threshold: 5, increase_factor: 1.05, decrease_factor: 0.95}
                }

EXPLORATION_ENSEMBLE: [{model_name: "qwen3-coder:480b-cloud", temp: 0.70, top_p: 0.92, retries: 3, weight: 0.7, verify_ssl: False},
                       {model_name: "deepseek-v3.2:cloud", temp: 0.70, top_p: 0.92, retries: 3, weight: 0.3, verify_ssl: False}]

EXPLOITATION_ENSEMBLE: [{model_name: "qwen3-coder:480b-cloud", temp: 0.70, top_p: 0.92, retries: 3, weight: 0.7, verify_ssl: False},
                        {model_name: "deepseek-v3.2:cloud", temp: 0.70, top_p: 0.92, retries: 3, weight: 0.3, verify_ssl: False}]

SAMPLER_AUX_LM: {model_name: "nemotron-3-nano:30b-cloud", temp: 0.45, top_p: 0.90, retries: 3, weight: 1, verify_ssl: False}

EMBEDDING: {model_name: "qwen3-embedding:4b", retries: 3, verify_ssl: False}

MAP_ELITES: {elite_map_type: "grid",
             features: [
              {name: "quadrupole_score", min_val: 0, max_val: 1, num_bins: 10},
              {name: "physics_score", min_val: 0, max_val: 1, num_bins: 10},
             ]
}

