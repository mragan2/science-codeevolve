SYS_MSG: |
  # PROMPT-BLOCK-START
  
  CONTEXT: You are an expert in Einstein-Cartan cosmology with torsion. You optimize torsion parameters to fit CMB TT, EE, and TE spectra simultaneously.
  
  YOUR MISSION:
  - Evolve torsion parameters (kappa, beta, r, n_t) to BEAT LCDM
  - Find optimal spin-torsion coupling for polarization
  - Predict B-mode amplitude for CMB-S4
  
  KNOWN FROM PREVIOUS EVOLUTION:
  - alpha = 3/2 is FIXED by ECSK theory (do not change!)
  - kappa ~ 0.804 gives S(2) ~ 0.196 for TT
  - Delta-BIC = -3.73 for TT alone
  
  PARAMETERS TO EVOLVE:
  - kappa: Torsion coupling strength [0.7, 0.9]
  - beta: Spin-polarization coupling [0.5, 0.8]
  - r_torsion: Tensor-to-scalar ratio [0.001, 0.06]
  - n_t: Tensor spectral tilt [-0.1, 0.1]
  
  ECSK THEORETICAL PREDICTIONS:
  - S_EE ~ S_TT^(2/3) for spin-2 coupling
  - r ~ kappa^2 * (H/M_P)^2 from bounce dynamics
  - n_t ~ -2*epsilon where epsilon is slow-roll parameter
  
  HARD CONSTRAINTS:
  1. S_TT(2) ~ 0.196 (Planck observation)
  2. r < 0.06 (BICEP/Keck limit)
  3. S(ell) -> 1 as ell -> infinity
  4. |n_t| < 0.1 (nearly scale-invariant)
  
  SUCCESS METRICS:
  - combined_score > 0.7 = good model
  - beats_lcdm = true (Delta-BIC < 0)
  - physics_score > 0.8 = physically consistent
  - correlation_score > 0.9 = consistent with S_EE ~ S_TT^(2/3)
  
  FORMULAS TO MODIFY:
  
  S_TT(ell) = 1 - kappa / (1 + (ell-2))^(3/2)   # alpha=3/2 fixed
  S_EE(ell) = S_TT(ell)^beta                     # evolve beta
  S_TE(ell) = sqrt(S_TT * S_EE)                  # cross-correlation
  
  POSSIBLE IMPROVEMENTS:
  - Sign modulation for TE at low ell (bounce dynamics)
  - Nonlinear EE-TT coupling
  - ell-dependent beta
  - Quantum corrections to r_torsion
  
  CRITICAL CODE RULES:
  1. Use ONLY ASCII characters (a-z, A-Z, 0-9, standard punctuation)
  2. NO Greek letters (alpha, beta, kappa, etc.) - use English names instead
  3. NO Unicode math symbols (no ≈, ∈, →, ², etc.)
  4. NO special characters that are not on a standard US keyboard
  5. Keep the same function signatures: get_torsion_params(), S_TT(ell, params), S_EE(ell, params), S_TE(ell, params)
  6. All functions must return valid floats > 0
  
  torsion / cartan / spin / bounce / tensor / B-mode / polarization
  
  # PROMPT-BLOCK-END

CODEBASE_PATH: "src/"
INIT_FILE_DATA: {filename: "init_program.py", language: "python"}
EVAL_FILE_NAME: "evaluate.py"
EVAL_TIMEOUT: 30

SEED: 42

MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG: {fitness_key: "combined_score",
                num_epochs: 100, ckpt: 10, max_size: null, init_pop: 10,
                exploration_rate: 0.35,
                selection_policy: roulette, selection_kwargs: {roulette_by_rank: True},
                early_stopping_rounds: 80,
                num_islands: 7, migration_topology: ring, migration_interval: 15, migration_rate: 0.15,
                meta_prompting: True,
                use_embedding: True, use_map_elites: True,
                num_inspirations: 4,
                max_chat_depth: 4,
                mp_start_marker: "# PROMPT-BLOCK-START", mp_end_marker: "# PROMPT-BLOCK-END",
                evolve_start_marker: "# EVOLVE-BLOCK-START", evolve_end_marker: "# EVOLVE-BLOCK-END",
                use_scheduler: True, type: PlateauScheduler, 
                scheduler_kwargs: {min_rate: 0.15, max_rate: 0.40, plateau_threshold: 5, increase_factor: 1.05, decrease_factor: 0.95}
                }

EXPLORATION_ENSEMBLE:
  - {model_name: "qwen3-coder:480b-cloud", temp: 0.75, top_p: 0.92, retries: 2, weight: 0.6, verify_ssl: False}
  - {model_name: "kimi-k2:1t-cloud", temp: 0.75, top_p: 0.92, retries: 2, weight: 0.4, verify_ssl: False}

EXPLOITATION_ENSEMBLE:
  - {model_name: "qwen3-coder:480b-cloud",   temp: 0.55, top_p: 0.90, retries: 2, weight: 0.7, verify_ssl: False}
  - {model_name: "devstral-2:123b-cloud",  temp: 0.55, top_p: 0.90, retries: 2, weight: 0.3, verify_ssl: False}

SAMPLER_AUX_LM:
  {model_name: "qwen3-next:80b-cloud", temp: 0.35, top_p: 0.90, retries: 2, weight: 1, verify_ssl: False}

EMBEDDING:
  {model_name: "qwen3-embedding:4b", retries: 3, verify_ssl: False}

# MAP ELITES: Explore trade-off between fit quality and tensor predictions
MAP_ELITES: {elite_map_type: "grid",
             features: [
              {name: "delta_bic", min_val: -10.0, max_val: 10.0, num_bins: 10},
              {name: "r_torsion", min_val: 0.0, max_val: 0.06, num_bins: 6},
             ]
}
