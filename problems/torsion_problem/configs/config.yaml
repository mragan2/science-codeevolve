SYS_MSG: |
  # PROMPT-BLOCK-START
  
  KONTEKST: Jesteś ekspertem w kosmologii Einsteina-Cartana z torsją. Optymalizujesz parametry torsji aby dopasować widma CMB TT, EE i TE jednocześnie.
  
  TWOJA MISJA:
  - Ewoluuj parametry torsji (κ, β, r, n_t) aby POKONAĆ ΛCDM
  - Znajdź optymalne sprzężenie spin-torsja dla polaryzacji
  - Przewiduj amplitudę B-mode dla CMB-S4
  
  ZNANE Z POPRZEDNIEJ EWOLUCJI:
  - α = 3/2 jest USTALONY przez teorię ECSK (nie zmieniaj!)
  - κ ≈ 0.804 daje S(2) ≈ 0.196 dla TT
  - ΔBIC = -3.73 dla samego TT
  
  PARAMETRY DO EWOLUCJI:
  - κ (kappa): Siła sprzężenia torsji [0.7, 0.9]
  - β (beta): Sprzężenie spin-polaryzacja [0.5, 0.8]
  - r_torsion: Stosunek tensor-do-skalar [0.001, 0.06]
  - n_t: Nachylenie spektralne tensorów [-0.1, 0.1]
  
  PRZEWIDYWANIA TEORETYCZNE ECSK:
  - S_EE ≈ S_TT^(2/3) dla sprzężenia spin-2
  - r ~ κ² * (H/M_P)² z dynamiki odbicia
  - n_t ≈ -2ε gdzie ε to parametr slow-roll
  
  TWARDE OGRANICZENIA:
  1. S_TT(2) ≈ 0.196 (obserwacja Planck)
  2. r < 0.06 (limit BICEP/Keck)
  3. S(ℓ) → 1 gdy ℓ → ∞
  4. |n_t| < 0.1 (prawie bezskałowe)
  
  METRYKI SUKCESU:
  - combined_score > 0.7 = dobry model
  - beats_lcdm = true (ΔBIC < 0)
  - physics_score > 0.8 = fizycznie spójny
  - correlation_score > 0.9 = zgodny z S_EE ≈ S_TT^(2/3)
  
  FORMUŁY DO MODYFIKACJI:
  
  S_TT(ℓ) = 1 - κ / (1 + (ℓ-2))^(3/2)      # α=3/2 ustalony
  S_EE(ℓ) = S_TT(ℓ)^β                       # ewoluuj β
  S_TE(ℓ) = sqrt(S_TT * S_EE)               # korelacja krzyżowa
  
  MOŻLIWE ULEPSZENIA:
  - Modulacja znaku dla TE przy niskich ℓ (dynamika odbicia)
  - Nieliniowe sprzężenie EE-TT
  - Zależność β od ℓ
  - Poprawki kwantowe do r_torsion
  
  torsion / cartan / spin / bounce / tensor / B-mode / polarization
  
  # PROMPT-BLOCK-END

CODEBASE_PATH: "src/"
INIT_FILE_DATA: {filename: "init_program.py", language: "python"}
EVAL_FILE_NAME: "evaluate.py"
EVAL_TIMEOUT: 30

SEED: 42

MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1

EVOLVE_CONFIG: {fitness_key: "combined_score",
                num_epochs: 100, ckpt: 10, max_size: null, init_pop: 20,
                exploration_rate: 0.30,
                selection_policy: roulette, selection_kwargs: {roulette_by_rank: True},
                early_stopping_rounds: 25,
                num_islands: 5, migration_topology: ring, migration_interval: 15, migration_rate: 0.15,
                meta_prompting: True,
                use_embedding: True, use_map_elites: True,
                num_inspirations: 4,
                max_chat_depth: 4,
                mp_start_marker: "# PROMPT-BLOCK-START", mp_end_marker: "# PROMPT-BLOCK-END",
                evolve_start_marker: "# EVOLVE-BLOCK-START", evolve_end_marker: "# EVOLVE-BLOCK-END",
                use_scheduler: True, type: PlateauScheduler, 
                scheduler_kwargs: {min_rate: 0.15, max_rate: 0.40, plateau_threshold: 5, increase_factor: 1.05, decrease_factor: 0.95}
                }

