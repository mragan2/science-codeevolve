  mp_start_marker: '# PROMPT-BLOCK-START'
  num_epochs: 100
  num_inspirations: 4
  num_islands: 5
  scheduler_kwargs:
    decrease_factor: 0.95
    increase_factor: 1.05
    max_rate: 0.4
    min_rate: 0.15
    plateau_threshold: 5
  selection_kwargs:
    roulette_by_rank: true
